SLIDES.push({ nav:'L7A — What is Wind Energy?', eyebrow:'Week 3 · Lesson 7 · Read', eyebrowR:'Lesson 7 · Screen A', title:'What is Wind Energy?', screenlbl:'Student screen 1 of 4', layout:'read', left:[{k:'read', long:true, heading:'Wind: energy from moving air', body:['Wind energy is electricity made from moving air. Scientists call that movement kinetic energy — the energy something has because it is moving. When wind pushes against the blades of a turbine, the blades spin. That spinning motion can be turned into electrical power for homes, schools and workplaces across Australia.', 'Wind itself begins with the Sun. The Sun heats Earth’s surface unevenly, so some air warms and rises while cooler air rushes in to take its place. That flowing air is wind. Places with strong, steady wind — such as open coasts and wide plains — are often good sites for capturing this renewable resource. Engineers check long-term wind records before they choose a site.', 'A single tall machine with blades is a turbine. When many turbines are built together in one area, the group is called a wind farm. Australia has wind farms in coastal and inland regions where the landscape is open enough for air to move freely. The space between turbines matters: each machine needs clear airflow to work well.', 'Wind energy does not burn fuel while it runs, so it does not release greenhouse gases during generation. That makes it an important option for communities that want cleaner electricity. Still, writers must explain clearly what wind is, where it comes from, and how turbines and wind farms turn kinetic energy into power that people can use.', 'In an information report, precise nouns matter. Words such as turbine, wind farm and kinetic energy help readers understand the science without guessing. A strong Year 5 explanation defines each term, links it to a real Australian place or process, and avoids vague phrases like “wind stuff” or “power things.”'], notice:'Look for definitions of turbine, wind farm and kinetic energy. You will use this text for check-in, cloze and glossary work.'}], right:[ {k:'wp', list:[{t:'turbine',d:'a machine with spinning blades used to generate electricity'}, {t:'wind farm',d:'a group of wind turbines built in one location'}, {t:'kinetic energy',d:'the energy an object has because of its movement'}, {t:'plains',d:'wide, mostly flat areas of land'}, {t:'renewable',d:'able to be replaced naturally and not run out quickly'}]}, {k:'checkin', items:[{type:'Literal:', q:'According to the text, what is kinetic energy?'}, {type:'Literal:', q:'What is the difference between a turbine and a wind farm?'}, {type:'Inferential:', q:'Why might open coasts and plains be chosen for wind farms?'}, {type:'Inferential:', q:'How does the Sun help create wind, even though turbines do not use sunlight directly?'}, {type:'Evaluative:', q:'Which glossary term is most important for a report introduction — and why?'}]} ], notes:`<h4>Screen A — Read + respond</h4><p>Long passage on wind as kinetic energy; vocab + written check-in.</p>` });

SLIDES.push({ nav:'L8A — How Wind Turbines Work', eyebrow:'Week 3 · Lesson 8 · Read', eyebrowR:'Lesson 8 · Screen A', title:'How Wind Turbines Work', screenlbl:'Student screen 1 of 4', layout:'read', left:[{k:'read', long:true, heading:'From blades to electricity', body:['A wind turbine turns the push of moving air into electricity. First, wind hits the blades. The blades are shaped so the air makes them spin. That spinning is called rotation — movement in a circle around a central point. Without reliable rotation, the rest of the machine cannot do its job.', 'As the blades rotate, they turn a long shaft inside the turbine. The shaft is connected to a generator. A generator is a machine that converts movement into electricity. In simple terms, the chain is: wind → blades → rotation → shaft → generator → electricity. Report writers explain this sequence so readers can follow each step.', 'Blade length matters. Longer blades sweep through more air, so they can capture more energy from the same wind. Designers also tip the blades at careful angles so rotation stays efficient and safe across different wind speeds. If the wind is too weak, rotation slows; if it is dangerously strong, turbines may shut down to protect the machine.', 'Location matters too. Offshore turbines sit out at sea, away from the coast. Ocean winds are often stronger and more steady than inland winds, so offshore sites can produce more electricity. Building and maintaining turbines at sea is harder and more expensive, so writers must weigh both the gain in power and the cost of working offshore.', 'In an information report, sequence language helps readers follow the process. Words such as first, then, next and finally make the turbine chain clear. Precise nouns — generator, rotation, offshore — stop the explanation from sounding vague and prepare a strong topic sentence about how wind produces electricity.'], notice:'Trace the sequence: blades → rotation → shaft → generator. You will use this text for check-in, cloze and your topic sentence.'}], right:[ {k:'wp', list:[{t:'generator',d:'a machine that converts movement into electricity'}, {t:'offshore',d:'located in the sea, away from the coast'}, {t:'rotation',d:'movement in a circle around a central point'}, {t:'shaft',d:'a long rod that turns and carries movement inside a machine'}, {t:'sequence',d:'the order in which steps happen'}]}, {k:'checkin', items:[{type:'Literal:', q:'List the turbine chain in order from wind to electricity.'}, {type:'Literal:', q:'What does a generator do, according to the text?'}, {type:'Inferential:', q:'Why might longer blades capture more energy?'}, {type:'Inferential:', q:'Why can offshore turbines produce more electricity even though they cost more to build?'}, {type:'Evaluative:', q:'Which step in the chain is most important to explain clearly in a report — and why?'}]} ], notes:`<h4>Screen A — Read + respond</h4><p>Long passage on turbine sequence; vocab + written check-in.</p>` });

SLIDES.push({ nav:'L9A — Wind Energy Pros and Cons', eyebrow:'Week 3 · Lesson 9 · Read', eyebrowR:'Lesson 9 · Screen A', title:'Wind Energy — Pros & Cons', screenlbl:'Student screen 1 of 4', layout:'read', left:[{k:'read', long:true, heading:'Weighing the wind', body:['Wind energy is one of the fastest-growing renewable sources in the world. When the wind turns the blades of a turbine, a generator converts that movement into electricity. Unlike coal or gas, wind power does not burn fuel, so it does not release greenhouse gases while it is running. In many places it is also among the cheapest ways to add new electricity to the grid. Once the turbines are built, the wind itself is free.', 'That does not mean wind energy is simple or perfect. Wind is intermittent: turbines only produce power when the wind blows within a useful range of speeds. On calm days output falls, and communities still need other sources or stored energy to keep supply consistent. Engineers connect wind farms to the grid through transmission lines, which can be expensive to build across long distances.', 'Wind farms also change the landscape. Onshore turbines need space between them and can be visible for kilometres. Some people enjoy the sight of clean energy; others feel turbines spoil views or create unwanted noise. Offshore wind farms sit out at sea, where winds are often stronger and more steady, but building and maintaining them is harder and more costly.', 'Wildlife is another concern. Birds and bats can collide with spinning blades, so careful siting and monitoring matter. At the same time, many communities welcome wind projects because they create construction and maintenance jobs and can pay landholders for turbine sites. Other communities oppose new farms because of noise, visual impact, or worries about property values.', 'A fair judgement weighs both sides. Wind energy can cut emissions and provide low-cost power, but it is not always available, it uses land or sea space, and it can affect people and animals nearby. Good decisions use evidence from both the advantages and the disadvantages.'], notice:'Look for both advantages and disadvantages as you read. You will use this text for check-in, cloze and your report paragraph.'}], right:[ {k:'wp', list:[{t:'intermittent',d:'not continuous; stopping and starting at irregular intervals'}, {t:'consistent',d:'happening at the same rate or level without much variation'}, {t:'transmission',d:'the process of sending electricity through power lines'}, {t:'landscape',d:'the visible features of an area of land'}, {t:'offshore',d:'located in the sea, away from the coast'}]}, {k:'checkin', items:[{type:'Literal:', q:'From the text, list two advantages of wind energy and two disadvantages.'}, {type:'Literal:', q:'What does the text say happens on calm days, and how can communities keep supply going?'}, {type:'Inferential:', q:'Wind is free after turbines are built — so why do wind farms still cost a lot of money?'}, {type:'Inferential:', q:'Why might an offshore wind farm be chosen even though it is harder and more costly to build?'}, {type:'Evaluative:', q:'Would you support a wind farm near your community? Use at least two pieces of evidence from the text to explain your judgement.'}]} ], notes:`<h4>Screen A — Read + respond</h4><p>Long passage left; Word Work + written 15-min check-in right (literal / inferential / evaluative).</p>` });

SLIDES.push({ nav:"L10A — What is Hydropower?", eyebrow:"Week 4 · Lesson 10 · Read", eyebrowR:"Lesson 10 · Screen A", title:"What is Hydropower?", screenlbl:'Student screen 1 of 4', layout:'read', left:[{k:'read', long:true, heading:"Power from moving water", body:['Hydropower is electricity generated from the energy of moving water. In many systems, a dam holds back a river and creates a large store of water called a reservoir. When water is released, it rushes forward with force and can spin turbines that drive generators. The same idea appears in small streams with waterwheels and in enormous mountain schemes that power whole regions.', 'Water high behind a dam has gravitational potential energy — stored energy because of its height. Gravity pulls the water downhill through the system. That is why mountainous regions with reliable rainfall or snowmelt are often strong places for hydropower. Catchments collect rain across wide areas of land and feed rivers and reservoirs over time.', 'Australia’s Snowy Hydro scheme is a famous example of using mountains, reservoirs and tunnels to generate electricity and manage water. Around the world, hydropower supplies a large share of renewable electricity because water can be stored and released when communities need power. That ability to time the release makes hydropower useful for keeping electricity grids steady.', 'Hydropower is renewable in the sense that the water cycle continues: rain and rivers keep refilling catchments over time. Still, building a dam changes a landscape forever. Valleys may flood, roads may move and river habitats may change. Report writers must define key terms carefully — hydropower, dam and reservoir — before they explain how the system works.', 'Precise language helps readers. Instead of saying “a big wall of water,” Year 5 writers use dam and reservoir. Instead of “water power,” they use hydropower. Clear definitions at the start of a report section prepare readers for later paragraphs about process, benefits and trade-offs. When you read, notice cause and effect: height stores energy; release creates movement; turbines make electricity.'], notice:"Look for definitions of hydropower, dam and reservoir."}], right:[ {k:'wp', list:[{t:'hydropower',d:'electricity generated from the energy of moving water'}, {t:'dam',d:'a barrier built across a river to hold back water'}, {t:'reservoir',d:'a large artificial lake used to store water'}, {t:'turbine',d:'a machine with blades spun by moving water or air'}, {t:'catchment',d:'an area of land where rainfall drains into a river or reservoir'}]}, {k:'checkin', items:[{type:'Literal:', q:'What is a reservoir, according to the text?'}, {type:'Literal:', q:'What kind of energy does water high behind a dam have?'}, {type:'Inferential:', q:'Why are mountains and rainfall useful for hydropower?'}, {type:'Inferential:', q:'Why must writers define dam and reservoir early in a report?'}, {type:'Evaluative:', q:'Which glossary term would you teach first — and why?'}]} ], notes:`<h4>Screen A</h4><p>Long read + check-in.</p>` });

SLIDES.push({ nav:"L11A — How Hydro Dams Work", eyebrow:"Week 4 · Lesson 11 · Read", eyebrowR:"Lesson 11 · Screen A", title:"How Hydro Dams Work", screenlbl:'Student screen 1 of 4', layout:'read', left:[{k:'read', long:true, heading:"From height to electricity", body:['A hydroelectric dam works by storing water at height and then guiding that water through machines that make electricity. Water held high in a reservoir has gravitational potential energy. Potential energy is stored energy an object has because of its position. The higher the water sits, the more energy is available when it falls.', 'When operators open the gates, water rushes down a large pipe called a penstock. Inside the dam, falling water spins turbines. The turbines drive generators that convert movement into electricity, which then travels through transmission lines to homes and industry. Each stage must be described in order so readers do not get lost.', 'Operators can control the flow. On days when electricity demand rises, more water can be released through the penstock. When demand falls, more water can be held back in the reservoir. That flexibility is one reason hydropower is valued for keeping grids steady. Writers can call this controlled release — a useful idea for a topic sentence.', 'The energy chain is useful for writers: rain and rivers fill the reservoir; height stores gravitational potential energy; the penstock carries water down; turbines and generators make electricity. Sequence words — first, then, next, finally — help readers follow each stage. A process paragraph should sound calm and exact, not rushed or chatty.', 'Precise adjectives also matter. Gravitational describes the force that pulls water downhill. Technical nouns such as penstock and potential energy stop a report from sounding vague. A strong topic sentence names how a dam turns stored water into electrical power. Later sentences add evidence from each step in the chain.'], notice:"Trace reservoir → penstock → turbines → generators."}], right:[ {k:'wp', list:[{t:'potential energy',d:'stored energy an object has because of its position'}, {t:'penstock',d:'a large pipe that carries water from a reservoir to the turbines'}, {t:'gravitational',d:'relating to the force of gravity that pulls objects downward'}, {t:'turbine',d:'a machine spun by moving water to help generate electricity'}, {t:'flow',d:'the movement of water through a system'}]}, {k:'checkin', items:[{type:'Literal:', q:'What is a penstock?'}, {type:'Literal:', q:'What kind of energy does water high in a reservoir store?'}, {type:'Inferential:', q:'Why can operators change how much electricity a dam makes?'}, {type:'Inferential:', q:'Why do sequence words help a report about dams?'}, {type:'Evaluative:', q:'Which step in the chain is hardest to explain — and why?'}]} ], notes:`<h4>Screen A</h4><p>Long read + check-in.</p>` });

SLIDES.push({ nav:"L11D — Report Work", eyebrow:"Week 4 · Lesson 11 · Report", eyebrowR:"Lesson 11 · Screen D", title:"Report work — hydro topic sentence", screenlbl:'Student screen 4 of 4', wideLeft:true, left:[{k:'html', html:`<div class="card cream stem-card"><span class="tag do">BUILD A PARAGRAPH</span><h3 style="margin:8px 0 6px;color:var(--cream-ink)">Choose stems · finish the sentences</h3><p style="margin-bottom:12px;font-size:14px;color:#4a5a54">Select stems to draft a process paragraph with a clear hydro topic sentence. Use penstock or potential energy.</p><div class="stem-grid"><span>Water stores energy…</span><span>First, gates open…</span><span>The penstock carries…</span><span>Falling water spins…</span><span>Generators convert movement…</span><span>Operators control flow…</span><span>This sequence shows…</span><span>For example,…</span><span>Overall, dams…</span><span>In summary,…</span></div></div>`}], right:[{k:'html', html:`<div class="card cream"><span class="tag wow">CHALLENGE</span><h3 style="margin:8px 0 6px;color:var(--cream-ink)">Teach the chain</h3><p>Explain reservoir → penstock → turbines → generators in four spoken steps, then write one topic sentence.</p></div>`},{k:'exit', items:["explain reservoir to generator in order","use penstock or potential energy in a sentence","draft a hydro topic sentence for my report"]}], notes:`<h4>Screen D</h4><p>Stems for process paragraph / topic sentence.</p>` });
SLIDES.push({ nav:"L12A — Hydropower Pros and Cons", eyebrow:"Week 4 · Lesson 12 · Read", eyebrowR:"Lesson 12 · Screen A", title:"Hydropower — Pros & Cons", screenlbl:'Student screen 1 of 4', layout:'read', left:[{k:'read', long:true, heading:"Weighing the water", body:['Hydropower has clear strengths. Once a dam is built, water can be released quickly to make electricity when demand rises. Stored water in a reservoir acts like a battery for the grid. Hydropower also produces electricity without burning fuel during generation, so it can support cleaner energy goals. Many countries rely on hydro for a large share of their renewable electricity.', 'There are serious trade-offs. Building a large dam can flood valleys and force the displacement of communities who lived on that land. Changing a river’s flow can damage habitat for fish and other living things and disrupt the wider ecosystem. Cultural sites and farms may be lost under a new reservoir. These costs belong in any honest report.', 'Engineers and governments try to reduce harm with careful planning, fish ladders and environmental flows — water released to support river health. Still, no large dam is without impact. A fair information report weighs reliable power and low operating emissions against displacement, habitat loss and ecosystem change. Readers trust writers who name both sides.', 'Useful report vocabulary includes habitat (the natural home of a living thing), displacement (when people are forced to leave their homes) and ecosystem (a community of living things and their environment). These nouns help writers discuss people and nature, not only machines. Precise words stop a paragraph from sounding vague or unfair.', 'Year 5 writers should keep a balanced tone. One advantage sentence needs a reason. One disadvantage sentence needs a reason. Connectives such as however, although and overall help the paragraph sound thoughtful rather than one-sided. Evidence from this reading — battery-like storage, flooding, habitat loss — should appear in your body paragraph.'], notice:"Look for both advantages and disadvantages."}], right:[ {k:'wp', list:[{t:'habitat',d:'the natural home or environment of an animal, plant or other organism'}, {t:'displacement',d:'when people are forced to leave their homes or land'}, {t:'ecosystem',d:'a community of living things interacting with their environment'}, {t:'reliable',d:'able to be trusted to work steadily when needed'}, {t:'impact',d:'a strong effect on people, places or nature'}]}, {k:'checkin', items:[{type:'Literal:', q:'List two advantages of hydropower from the text.'}, {type:'Literal:', q:'List two disadvantages of large dams from the text.'}, {type:'Inferential:', q:'Why is a reservoir sometimes compared to a battery?'}, {type:'Inferential:', q:'Why might environmental flows be included in a dam plan?'}, {type:'Evaluative:', q:'Would you support a new dam near a town? Use two pieces of evidence from the text.'}]} ], notes:`<h4>Screen A</h4><p>Long read + check-in.</p>` });

SLIDES.push({ nav:"L12C — Cloze", eyebrow:"Week 4 · Lesson 12 · Cloze", eyebrowR:"Lesson 12 · Screen C", title:'Cloze — fill the gaps', screenlbl:'Student screen 3 of 4', wideLeft:true, left:[{k:'cloze',label:'KNOWLEDGE — CLOZE',heading:"Hydro trade-offs — cloze",text:"Hydro gives steady, reliable power and can start quickly. But large dams can flood land and cause {{displacement}} of communities. Changing a river can damage {{habitat}} and the wider {{ecosystem}}. Fish ladders and environmental flows aim to reduce {{harm}}. Balanced reports name both benefits and {{drawbacks}}."}], right:[{k:'html', html:`<div class="card cream"><span class="tag do">REPORT LANGUAGE</span><h3 style="margin:8px 0 6px;color:var(--cream-ink)">From today’s cloze</h3><p style="margin-bottom:8px;font-size:14px;color:#4a5a54">Use only words that appear in the cloze passage.</p><p style="margin-bottom:8px"><b>1. Effective verbs</b> — list verbs from the cloze (e.g. <i>gives, flood, cause, damage, reduce</i>).</p><p style="margin-bottom:8px"><b>2. Important report nouns</b> — list precise nouns from the cloze (e.g. <i>displacement, habitat, ecosystem, drawbacks</i>).</p><p style="margin-bottom:0"><b>3. Useful adjectives</b> — list describing words from the cloze (e.g. <i>steady, reliable, large, Balanced</i>).</p></div>`},{k:'discuss', title:'Share your word bank', label:'TALK', prompts:["Which cloze noun names a social cost?","Which cloze noun names an environmental cost?","Which adjective helps a report sound fair?"]}], notes:`<h4>Screen C</h4><p>Answer key: displacement, habitat, ecosystem, harm, drawbacks.</p>` });

SLIDES.push({ nav:"L13A — What is Geothermal Energy?", eyebrow:"Week 5 · Lesson 13 · Read", eyebrowR:"Lesson 13 · Screen A", title:"What is Geothermal Energy?", screenlbl:'Student screen 1 of 4', layout:'read', left:[{k:'read', long:true, heading:"Heat from inside Earth", body:['Geothermal energy is heat from inside the Earth. Far below our feet, the planet stays extremely hot. In some places that heat rises closer to the surface as hot rocks, hot springs, geysers and volcanic activity. When people capture that heat carefully, it can warm buildings or help generate electricity.', 'The word geothermal comes from Greek roots: geo means Earth and thermal means heat. Magma is molten rock deep underground. Geologists study rocks, heat and movement in the crust so engineers know where geothermal systems might work. Not every country has the same geothermal opportunities, because Earth’s crust is thicker in some places and thinner or cracked in others.', 'Iceland and parts of New Zealand use geothermal energy widely for electricity and heating. Australia has promising sites too, especially where hot rocks sit under the land. Report writers should notice that geothermal is renewable in the sense that Earth’s internal heat continues over long timescales, but useful sites are not equally available everywhere.', 'Clear definitions help readers. Instead of writing “Earth heat,” Year 5 writers use geothermal. Instead of “melted rock,” they use magma. Naming the geologist’s role shows that science and careful investigation sit behind energy projects. A strong glossary paragraph teaches these terms before later lessons explain how plants work or weigh pros and cons.', 'When you read about geothermal energy, look for place examples, cause-and-effect links and precise nouns. Ask: Where does the heat come from? How do people notice it at the surface? Why do some countries use it more than others? Those questions prepare you to write like a report author who informs, not just entertains.'], notice:"Look for definitions of geothermal, magma and geologist."}], right:[ {k:'wp', list:[{t:'geothermal',d:'heat energy from inside the Earth'}, {t:'magma',d:'molten rock beneath the Earth’s surface'}, {t:'geologist',d:'a scientist who studies rocks, Earth layers and natural processes'}, {t:'geyser',d:'a hot spring that shoots steam and water into the air'}, {t:'crust',d:'the outer solid layer of the Earth'}]}, {k:'checkin', items:[{type:'Literal:', q:'What does geothermal energy use?'}, {type:'Literal:', q:'What is magma?'}, {type:'Inferential:', q:'Why might Iceland use geothermal energy more than some other countries?'}, {type:'Inferential:', q:'Why should a report define geothermal before explaining plants?'}, {type:'Evaluative:', q:'Which glossary term would you teach first — and why?'}]} ], notes:`<h4>Screen A</h4><p>Long read + check-in.</p>` });
SLIDES.push({ nav:"L13B — English practice", eyebrow:"Week 5 · Lesson 13 · English practice", eyebrowR:"Lesson 13 · Screen B", title:"English practice — geo words", screenlbl:'Student screen 2 of 4', layout:'drill', left:[{k:'drill', title:'SET A · Spelling & words', qs:[{ask:"Correct the spelling mistake.",sample:"Geotherml energy comes from Earth heat."},{ask:"Unjumble the word.",sample:"gamm"},{ask:"Circle the correct spelling.",choices:["geologist","geoligist","geolagist"],line:false},{ask:"Geo- means:",choices:["water","Earth","wind"],line:false},{ask:"Write a synonym for heat (as in Earth heat)."},{ask:"Add the prefix geo-.",sample:"______ + thermal"},{ask:"How many syllables are in geothermal?",choices:["3","4","5"],line:false},{ask:"Circle the molten-rock noun.",sample:"Magma sits deep below the crust."},{ask:"Correct the spelling mistake.",sample:"A geoligist studies rocks and heat."},{ask:"Rewrite with a capital letter and a full stop.",sample:"geothermal energy comes from Earth"}]}], right:[{k:'drill', title:'SET B · Grammar & sentences', qs:[{ask:"Add a comma.",sample:"In Iceland geothermal heat warms homes."},{ask:"Circle the technical noun.",sample:"Geothermal energy uses heat from Earth."},{ask:"Change to simple past tense.",sample:"Geologists study hot rocks carefully."},{ask:"Is this a statement, question or command?",sample:"What is magma?",choices:["statement","question","command"],line:false},{ask:"Add the missing apostrophe.",sample:"Earths core stays extremely hot."},{ask:"Underline the subject.",sample:"Geysers shoot steam into the air."},{ask:"Join using because.",sample:"Some places use geothermal. Heat rises near the surface."},{ask:"Rewrite in formal report language.",sample:"The ground has crazy hot melted rock."},{ask:"Circle the verbs.",sample:"Geologists study rocks and advise engineers."},{ask:"The underlined word names Earth heat.",sample:"Geothermal energy can generate electricity.",yn:true,line:false}]}], notes:`<h4>Screen B</h4><p SLIDES.push({ nav:"L13D — Report Work", eyebrow:"Week 5 · Lesson 13 · Report", eyebrowR:"Lesson 13 · Screen D", title:"Report work — geothermal glossary paragraph", screenlbl:'Student screen 4 of 4', wideLeft:true, left:[{k:'html', html:`<div class="card cream stem-card"><span class="tag do">BUILD A PARAGRAPH</span><h3 style="margin:8px 0 6px;color:var(--cream-ink)">Choose stems · finish the sentences</h3><p style="margin-bottom:12px;font-size:14px;color:#4a5a54">Select stems to draft a glossary-style paragraph on geothermal energy. Include geothermal, magma or geologist.</p><div class="stem-grid"><span>Geothermal energy is…</span><span>Magma is…</span><span>Geologists study…</span><span>At the surface…</span><span>In Iceland,…</span><span>For example,…</span><span>This matters because…</span><span>Writers must define…</span><span>Overall, geothermal…</span><span>In summary,…</span></div></div>`}], right:[{k:'html', html:`<div class="card cream"><span class="tag wow">CHALLENGE</span><h3 style="margin:8px 0 6px;color:var(--cream-ink)">Country snapshot</h3><p>Add one factual sentence about Iceland or New Zealand using a glossary term correctly.</p></div>`},{k:'exit', items:["define geothermal or magma in my own words","use geologist in a sentence","add geo terms to my glossary or report"]}], notes:`<h4>Screen D</h4><p>Stems for glossary paragraph; country challenge.</p>` });
SLIDES.push({ nav:"L14A — How Geothermal Plants Work", eyebrow:"Week 5 · Lesson 14 · Read", eyebrowR:"Lesson 14 · Screen A", title:"How Geothermal Plants Work", screenlbl:'Student screen 1 of 4', layout:'read', left:[{k:'read', long:true, heading:"From underground heat to power", body:['A geothermal power plant turns underground heat into electricity. Engineers first identify a promising site, then drill wells into hot rock or underground water systems. In many plants, hot water or steam rises through the wells. Steam spins turbines, and generators convert that movement into electrical energy for the grid.', 'A geyser is a natural reminder that heated water and steam can burst upward with force. In a power plant, the process is controlled. Pipes, turbines and cooling systems guide steam safely. After steam has done its work, water may be cooled and returned underground so the resource can be used again.', 'One advantage of geothermal electricity is that it can run for long periods. Unlike wind or sunlight, Earth’s heat at a well-chosen site does not stop at night. That continuous generation helps communities that need steady power. Still, drilling is expensive and only works where underground heat is close enough to reach.', 'Report writers should explain the chain clearly: heat underground → wells → steam or hot water → turbines → generators → electricity. Sequence words such as first, then, next and finally help readers follow each stage. Technical nouns such as steam, drill and geyser keep the explanation precise.', 'A strong topic sentence might say that geothermal plants capture Earth’s heat to produce continuous electricity. Later sentences add evidence: drilling reaches hot zones; steam spins turbines; cooled water can return below. Precise adjectives — continuous, underground, controlled — stop the paragraph from sounding vague or childish.'], notice:"Trace wells → steam → turbines → electricity."}], right:[ {k:'wp', list:[{t:'geyser',d:'a hot spring that erupts with steam and water'}, {t:'steam',d:'water turned into gas by heat'}, {t:'drill',d:'to bore a deep hole into rock to reach heat or fluids'}, {t:'turbine',d:'a machine spun by steam or moving fluid to help make electricity'}, {t:'continuous',d:'happening without stopping for long periods'}]}, {k:'checkin', items:[{type:'Literal:', q:'What does steam do in a geothermal plant?'}, {type:'Literal:', q:'Why do engineers drill wells?'}, {type:'Inferential:', q:'Why can geothermal electricity keep running at night?'}, {type:'Inferential:', q:'Why do sequence words help a plant explanation?'}, {type:'Evaluative:', q:'Which step in the chain is hardest to explain — and why?'}]} ], notes:`<h4>Screen A</h4><p>Long read + check-in.</p>` });

SLIDES.push({ nav:"L14C — Cloze", eyebrow:"Week 5 · Lesson 14 · Cloze", eyebrowR:"Lesson 14 · Screen C", title:'Cloze — fill the gaps', screenlbl:'Student screen 3 of 4', wideLeft:true, left:[{k:'cloze',label:'KNOWLEDGE — CLOZE',heading:"Inside a geothermal plant — cloze",text:"Engineers {{drill}} wells to reach underground heat. Hot water or {{steam}} rises and spins {{turbines}}. Generators turn movement into electricity that can run for long periods. A natural {{geyser}} shows how heated water can burst upward. Precise nouns help readers follow each {{step}}."}], right:[{k:'html', html:`<div class="card cream"><span class="tag do">REPORT LANGUAGE</span><h3 style="margin:8px 0 6px;color:var(--cream-ink)">From today’s cloze</h3><p style="margin-bottom:8px;font-size:14px;color:#4a5a54">Use only words that appear in the cloze passage.</p><p style="margin-bottom:8px"><b>1. Effective verbs</b> — list verbs from the cloze (e.g. <i>drill, rises, spins, turn, shows</i>).</p><p style="margin-bottom:8px"><b>2. Important report nouns</b> — list precise nouns from the cloze (e.g. <i>steam, turbines, geyser, step</i>).</p><p style="margin-bottom:0"><b>3. Useful adjectives</b> — list describing words from the cloze (e.g. <i>Hot, underground, natural, Precise</i>).</p></div>`},{k:'discuss', title:'Share your word bank', label:'TALK', prompts:["Which cloze noun is essential in a topic sentence?","Which cloze verb starts the engineering process?","Which word helps show sequence to a reader?"]}], notes:`<h4>Screen C</h4><p>Answer key: drill, steam, turbines, geyser, step.</p>` });

SLIDES.push({ nav:"L15A — Geothermal Pros and Cons", eyebrow:"Week 5 · Lesson 15 · Read", eyebrowR:"Lesson 15 · Screen A", title:"Geothermal Energy — Pros & Cons", screenlbl:'Student screen 1 of 4', layout:'read', left:[{k:'read', long:true, heading:"Weighing Earth’s heat", body:['Geothermal energy has important strengths. At a well-chosen site, plants can produce electricity almost continuously, day and night. The fuel does not need to be delivered by truck or ship, because the heat is already underground. During generation, geothermal plants typically produce far fewer greenhouse gases than coal or gas plants.', 'There are also limits. Useful geothermal heat is not available everywhere — it is often strongest near volcanic regions or special hot-rock areas. Drilling deep wells is expensive and risky. In some places, projects may trigger small earthquakes or release underground gases. Building plants can also disturb local land and habitats.', 'Communities must decide whether the benefits outweigh the costs. Iceland harnesses geothermal energy successfully because its geology suits the technology. Other countries may find geothermal harder to develop. A fair information report names both sides: reliable low-emission power on one hand; limited sites, high costs and local impacts on the other.', 'Useful vocabulary includes limited (not available everywhere), volcanic (related to volcanoes) and harness (to capture and use a natural force). These words help writers discuss geography and engineering honestly. Adjectives such as continuous, expensive and careful keep the tone balanced.', 'Year 5 writers should avoid one-sided cheerleading. One advantage sentence needs a reason. One disadvantage sentence needs a reason. Connectives such as however, although and overall help the paragraph sound thoughtful. Evidence from Screen A — continuous power, limited sites, drilling costs — belongs in the body paragraph.'], notice:"Look for both advantages and disadvantages."}], right:[ {k:'wp', list:[{t:'limited',d:'restricted; not available everywhere or in unlimited amounts'}, {t:'volcanic',d:'relating to volcanoes or volcanic regions'}, {t:'harness',d:'to capture and use a natural force for energy'}, {t:'continuous',d:'able to keep running for long periods'}, {t:'impact',d:'a strong effect on people, places or nature'}]}, {k:'checkin', items:[{type:'Literal:', q:'List two advantages of geothermal energy from the text.'}, {type:'Literal:', q:'List two disadvantages from the text.'}, {type:'Inferential:', q:'Why might geothermal suit Iceland more than some countries?'}, {type:'Inferential:', q:'Why should a report use however when discussing geothermal?'}, {type:'Evaluative:', q:'Would you support a geothermal plant near a town? Use two pieces of evidence from the text.'}]} ], notes:`<h4>Screen A</h4><p>Long read + check-in.</p>` });

SLIDES.push({ nav:"L15C — Cloze", eyebrow:"Week 5 · Lesson 15 · Cloze", eyebrowR:"Lesson 15 · Screen C", title:'Cloze — fill the gaps', screenlbl:'Student screen 3 of 4', wideLeft:true, left:[{k:'cloze',label:'KNOWLEDGE — CLOZE',heading:"Geothermal trade-offs — cloze",text:"Geothermal can give nearly {{continuous}} power with low greenhouse gases. Countries {{harness}} underground heat where geology allows. However, useful sites are {{limited}} and often linked to {{volcanic}} regions. Drilling is expensive and may cause local {{impacts}}. Balanced reports name both benefits and drawbacks."}], right:[{k:'html', html:`<div class="card cream"><span class="tag do">REPORT LANGUAGE</span><h3 style="margin:8px 0 6px;color:var(--cream-ink)">From today’s cloze</h3><p style="margin-bottom:8px;font-size:14px;color:#4a5a54">Use only words that appear in the cloze passage.</p><p style="margin-bottom:8px"><b>1. Effective verbs</b> — list verbs from the cloze (e.g. <i>give, harness, allows, cause</i>).</p><p style="margin-bottom:8px"><b>2. Important report nouns</b> — list precise nouns from the cloze (e.g. <i>continuous, sites, impacts, drawbacks</i>).</p><p style="margin-bottom:0"><b>3. Useful adjectives</b> — list describing words from the cloze (e.g. <i>nearly, useful, volcanic, expensive, Balanced</i>).</p></div>`},{k:'discuss', title:'Share your word bank', label:'TALK', prompts:["Which cloze adjective names a strength?","Which cloze adjective names a geography limit?","Which verb means capture and use?"]}], notes:`<h4>Screen C</h4><p>Answer key: continuous, harness, limited, volcanic, impacts.</p>` });

SLIDES.push({ nav:"L16A — What is Tidal Energy?", eyebrow:"Week 6 · Lesson 16 · Read", eyebrowR:"Lesson 16 · Screen A", title:"What is Tidal Energy?", screenlbl:'Student screen 1 of 4', layout:'read', left:[{k:'read', long:true, heading:"Power from ocean tides", body:['Tidal energy comes from the rise and fall of the ocean. Tides are caused mainly by the Moon’s gravitational pull on Earth, with the Sun adding a smaller effect. As sea levels rise and fall along coasts, huge volumes of water move. That movement stores energy that engineers can try to capture.', 'One special feature of tidal power is that it is predictable. Scientists can forecast tide times years ahead because the Moon’s orbit follows known patterns. That predictability helps planners know when electricity might be generated. Still, the strength of tides varies by place — some coastlines have dramatic tidal ranges, while others barely change.', 'Tidal energy is renewable because the Moon keeps orbiting and tides keep happening. It is different from wave energy, which depends more on wind across the surface. Report writers must keep those ideas separate. Precise phrases such as gravitational pull and predictable ocean power stop readers from mixing tides with storms or random waves.', 'Australia has long coastlines, but not every bay or estuary has a tidal range large enough for major projects. Around the world, only certain sites are strong candidates. That geographic limit belongs in a fair report alongside the promise of clean, timed power.', 'A glossary paragraph should define tidal, gravitational pull and predictable before later lessons explain barrages and underwater generators. Year 5 writers use evidence: Moon pull → tides → moving water → possible electricity. Clear nouns and careful adjectives build trust with the reader.'], notice:"Look for definitions of tidal, gravitational pull and predictable."}], right:[ {k:'wp', list:[{t:'tidal',d:'relating to the rise and fall of the ocean'}, {t:'gravitational pull',d:'the attracting force of gravity from a large body such as the Moon'}, {t:'predictable',d:'able to be forecast accurately in advance'}, {t:'tide',d:'the regular rise and fall of sea level'}, {t:'coastline',d:'the edge where land meets the ocean'}]}, {k:'checkin', items:[{type:'Literal:', q:'What mainly causes tides, according to the text?'}, {type:'Literal:', q:'Why are tides described as predictable?'}, {type:'Inferential:', q:'Why might some coastlines be better for tidal energy than others?'}, {type:'Inferential:', q:'Why must writers separate tidal energy from wave energy?'}, {type:'Evaluative:', q:'Which glossary term would you teach first — and why?'}]} ], notes:`<h4>Screen A</h4><p>Long read + check-in.</p>` });

SLIDES.push({ nav:"L16C — Cloze", eyebrow:"Week 6 · Lesson 16 · Cloze", eyebrowR:"Lesson 16 · Screen C", title:'Cloze — fill the gaps', screenlbl:'Student screen 3 of 4', wideLeft:true, left:[{k:'cloze',label:'KNOWLEDGE — CLOZE',heading:"Tidal energy — cloze",text:"{{Tidal}} energy comes from the rise and fall of the ocean. The Moon’s {{gravitational pull}} is the main cause of tides. Tide times are highly {{predictable}}, which helps energy planners. Not every {{coastline}} has a large enough tidal range. Report writers define key {{nouns}} before explaining capture methods."}], right:[{k:'html', html:`<div class="card cream"><span class="tag do">REPORT LANGUAGE</span><h3 style="margin:8px 0 6px;color:var(--cream-ink)">From today’s cloze</h3><p style="margin-bottom:8px;font-size:14px;color:#4a5a54">Use only words that appear in the cloze passage.</p><p style="margin-bottom:8px"><b>1. Effective verbs</b> — list verbs from the cloze (e.g. <i>comes, is, helps, define</i>).</p><p style="margin-bottom:8px"><b>2. Important report nouns</b> — list precise nouns from the cloze (e.g. <i>Tidal, gravitational pull, coastline, nouns</i>).</p><p style="margin-bottom:0"><b>3. Useful adjectives</b> — list describing words from the cloze (e.g. <i>main, highly, predictable, large, key</i>).</p></div>`},{k:'discuss', title:'Share your word bank', label:'TALK', prompts:["Which cloze noun/phrase belongs in a glossary first?","Which cloze adjective is a special tidal strength?","Which place noun shows geography matters?"]}], notes:`<h4>Screen C</h4><p>Answer key: Tidal, gravitational pull, predictable, coastline, nouns.</p>` });

SLIDES.push({ nav:"L17A — How Tidal Energy is Captured", eyebrow:"Week 6 · Lesson 17 · Read", eyebrowR:"Lesson 17 · Screen A", title:"How Tidal Energy is Captured", screenlbl:'Student screen 1 of 4', layout:'read', left:[{k:'read', long:true, heading:"Barrages and stream generators", body:['Engineers capture tidal energy in more than one way. A tidal barrage is a dam-like structure built across an estuary — a place where a river meets the sea. As the tide rises and falls, water is forced through turbines in the barrage. The moving water spins the turbines and generators make electricity.', 'Another approach uses a tidal stream generator. These machines sit underwater in places with strong tidal currents. Flowing water turns blades, similar in idea to a wind turbine, but powered by the sea. Stream generators do not always need a full barrage across a whole estuary, so their footprint can look different on a map.', 'Both methods rely on predictable tidal movement, yet each has trade-offs. Barrages can generate large amounts of power but may change an estuary’s habitat for birds, fish and other living things. Underwater stream generators may be easier to place in some channels, but they still need careful design so marine life and shipping stay safe.', 'Report writers compare technologies with clear topic sentences. One paragraph might explain how a barrage works; another might describe stream generators. Comparison words — both, however, unlike, similarly — help readers see differences without confusion. Technical nouns such as estuary, tidal barrage and tidal stream generator keep the writing precise.', 'A strong topic sentence might state that tidal energy can be captured with barrages across estuaries or with underwater stream generators. Supporting sentences then explain process, place and impact. Year 5 writers finish by reminding readers that site choice matters as much as the machine itself.'], notice:"Compare tidal barrage and tidal stream generator."}], right:[ {k:'wp', list:[{t:'tidal barrage',d:'a dam-like barrier across an estuary that uses tidal flow to make electricity'}, {t:'estuary',d:'a coastal area where a river meets the sea'}, {t:'tidal stream generator',d:'an underwater machine spun by tidal currents to make electricity'}, {t:'current',d:'a steady flow of water in one direction'}, {t:'compare',d:'to examine similarities and differences'}]}, {k:'checkin', items:[{type:'Literal:', q:'What is a tidal barrage?'}, {type:'Literal:', q:'Where might a tidal stream generator sit?'}, {type:'Inferential:', q:'Why might a barrage change habitat in an estuary?'}, {type:'Inferential:', q:'Why do comparison words help a report about tidal capture?'}, {type:'Evaluative:', q:'Which capture method would you explain first in a report — and why?'}]} ], notes:`<h4>Screen A</h4><p>Long read + check-in.</p>` });

SLIDES.push({ nav:'L18A — Comparing All Five Energy Types', eyebrow:'Week 6 · Lesson 18 · Learn', eyebrowR:'Lesson 18 · Screen A', title:'Comparing All Five Energy Types', screenlbl:'Student screen 1 of 4', wideLeft:true, left:[{k:'read',heading:'Comparing energy types',body:['No single renewable suits every location — reports compare solar, wind, hydro, geothermal and tidal.','Writers weigh advantages, disadvantages, location and reliability for audiences.'],notice:'Key terms: compare, contrast, advantage.'},{k:'html', html:`<div class="card spell"><span class="tag read">SPELLING FOCUS — prefix: ad-</span><p class="spell-words"><span>ad·van·tage</span><span>ad·apt</span><span>ad·vance</span></p><p class="spell-hint">ad- means "toward." Write two more words starting with ad-.</p></div>`}, {k:'hook', q:'If you were advising Australia on which renewable energy to invest in, which would you choose and why?'}], right:[ {k:'win15', can:'compare two renewable types using one criterion', prove:'Say which wins on that criterion and why.'},{k:'wp', list:[{t:'compare',d:'to examine the similarities and differences between things'}, {t:'contrast',d:'to highlight the differences between two or more things'}, {t:'advantage',d:'a positive feature or benefit of something'}]},  {k:'img', hero:true, src:'energy-comparison-chart.png', diagram:true, cap:'Comparing All Five Energy Types'}], notes:`<p>Week 6 · Lesson 18 · Learn — Comparing All Five Energy Types</p>` });
SLIDES.push({ nav:'L18B — Content', eyebrow:'Week 6 · Lesson 18 · Apply', eyebrowR:'Lesson 18 · Screen B', title:'Week 6 Lesson 18 — Content', screenlbl:'Student screen 2 of 4', wideLeft:true, left:[{k:'html', html:`<div class="card cream"><span class="tag do">SENTENCE WORK — </span><p style="margin-top:10px;font-size:14px;color:#4a5a54">Starters: "Solar energy is best suited to…"  |  "The main difference between [X] and [Y] is…"</p></div>`}, {k:'read', heading:'Reading', body:['We have now studied five renewable energy sources: solar, wind, hydro, geothermal and tidal. Each works best in different locations: solar in sunny regions, wind in open areas, hydro near strong rivers, geothermal near volcanic zones and tidal along coastlines with large tidal ranges. No single source can meet all our needs. Energy experts recommend a "renewable energy mix" — combining multiple sources for reliable, clean electricity supply.', 'Complete your Comparison Table for all 5 types: How it works / Advantage / Disadvantage / Best location.', 'Review and complete all five body paragraph topic sentences. Share with your teacher for feedback.', '⭐ Challenge: Create an infographic comparing two energy types.']}], right:[{k:'steps', label:'Do this', rows:[{t:'Note-taking',d:'Complete your Comparison Table for all 5 types: How it works / Advantage / Disadvantage / Best location.'}, {t:'Report Work — Review',d:'Review and complete all five body paragraph topic sentences. Share with your teacher for feedback.'}]}, {k:'html', html:`<div class="card dark"><span class="tag try">CHALLENGE</span><p style="margin-top:10px;color:var(--ink);font-size:15px;line-height:1.5">⭐ Challenge: Create an infographic comparing two energy types.</p></div>`}], notes:`<p>Week 6 · Lesson 18 · Apply — Week 6 Lesson 18 — Content</p>` });

SLIDES.push({ nav:'L19A — Information Report Structure', eyebrow:'Week 7 · Lesson 19 · Learn', eyebrowR:'Lesson 19 · Screen A', title:'Information Report Structure', screenlbl:'Student screen 1 of 2', wideLeft:true, left:[{k:'html', html:`<div class="card spell"><span class="tag read">SPELLING FOCUS — prefix: intro-</span><p class="spell-words"><span>in·tro·duc·tion</span><span>in·tro·duce</span><span>in·tro·vert</span></p><p class="spell-hint">intro- means "into." How does this apply to each word?</p></div>`}, {k:'hook', q:'What do you already know about information reports? What sections do they usually have?'}], right:[ {k:'win15', can:'name the main sections of an information report', prove:'List them in order.'}, {k:'wp', list:[{t:'introduction',d:'the opening section that defines and contextualises the topic'}, {t:'general statement',d:'a broad opening sentence that defines or classifies the topic'}, {t:'technical language',d:'specialist words used for a particular subject area'}]},  {k:'img', hero:true, src:'information-report-structure.png', diagram:true, cap:'Information Report Structure'}], notes:`<p>Week 7 · Lesson 19 · Learn — Information Report Structure</p>` });
SLIDES.push({ nav:'L19B — Content', eyebrow:'Week 7 · Lesson 19 · Apply', eyebrowR:'Lesson 19 · Screen B', title:'Week 7 Lesson 19 — Content', screenlbl:'Student screen 2 of 2', wideLeft:true, left:[{k:'html', html:`<div class="card cream"><span class="tag do">SENTENCE WORK — Analyse</span><p style="margin-top:10px;font-size:16px;line-height:1.5">"Renewable energy is a broad term that describes any energy source naturally replenished by the environment."</p><p style="margin-top:10px;font-size:16px;line-height:1.5">Your turn: Identify the defining relative clause. What does it do? Circle the technical language.</p><p style="margin-top:10px;font-size:14px;color:#4a5a54">Starters: "An information report is a type of writing that…"  |  "The three main sections are…"</p></div>`}, {k:'read', heading:'Reading', body:['An information report presents facts about a topic clearly and objectively. It uses technical language and is written in the present tense with formal language. A typical information report has three parts: an introduction that defines the topic; body paragraphs explaining different aspects in detail; and a conclusion that sums up the key points. Understanding this structure will help you plan and write your own report on renewable energy.', 'Draw the 3-part structure of an information report with labels: Introduction / Body / Conclusion.', 'Use your notes to list the sections you will include in your report. Show your plan to your teacher.', '⭐ Challenge: Find a published information report. Identify its intro, body and conclusion.']}], right:[{k:'steps', label:'Do this', rows:[{t:'Note-taking',d:'Draw the 3-part structure of an information report with labels: Introduction / Body / Conclusion.'}, {t:'Report Work — Planning',d:'Use your notes to list the sections you will include in your report. Show your plan to your teacher.'}]}, {k:'html', html:`<div class="card dark"><span class="tag try">CHALLENGE</span><p style="margin-top:10px;color:var(--ink);font-size:15px;line-height:1.5">⭐ Challenge: Find a published information report. Identify its intro, body and conclusion.</p></div>`}, {k:'exit', items:['follow report structure', 'draft or revise my report', 'use formal present-tense language']}], notes:`<p>Week 7 · Lesson 19 · Apply — Week 7 Lesson 19 — Content</p>` });
SLIDES.push({ nav:'L20A — Writing an Introduction', eyebrow:'Week 7 · Lesson 20 · Learn', eyebrowR:'Lesson 20 · Screen A', title:'Writing an Introduction', screenlbl:'Student screen 1 of 2', wideLeft:true, left:[{k:'html', html:`<div class="card spell"><span class="tag read">SPELLING FOCUS — suffix: -tion</span><p class="spell-words"><span>in·tro·duc·tion</span><span>el·ab·or·a·tion</span><span>in·for·ma·tion</span></p><p class="spell-hint">Remove -tion from each word. What verb is left?</p></div>`}, {k:'hook', q:'What should the very first sentence of your report do? Why does it matter so much?'}], right:[ {k:'win15', can:'write one introduction sentence for my energy report', prove:'Include the topic and purpose.'}, {k:'wp', list:[{t:'paragraph',d:'a group of sentences about one connected idea'}, {t:'topic sentence',d:'the opening sentence of a paragraph, stating the main idea'}, {t:'elaboration',d:'adding more detail, examples or explanation to support an idea'}]},  {k:'img', hero:true, src:'topic-sentence-example.png', diagram:true, cap:'Writing an Introduction'}], notes:`<p>Week 7 · Lesson 20 · Learn — Writing an Introduction</p>` });
SLIDES.push({ nav:'L20B — Content', eyebrow:'Week 7 · Lesson 20 · Apply', eyebrowR:'Lesson 20 · Screen B', title:'Week 7 Lesson 20 — Content', screenlbl:'Student screen 2 of 2', wideLeft:true, left:[{k:'html', html:`<div class="card cream"><span class="tag do">SENTENCE WORK — Combine</span><p style="margin-top:10px;font-size:16px;line-height:1.5">"Solar energy is clean." "It does not produce harmful gases." "It can be used wherever the sun shines."</p><p style="margin-top:10px;font-size:16px;line-height:1.5">Your turn: Join all three into one fluent sentence.</p><p style="margin-top:10px;font-size:14px;color:#4a5a54">Starters: "Renewable energy is a broad term that…"  |  "In this report, I will discuss…"</p></div>`}, {k:'read', heading:'Reading', body:['The introduction of an information report tells the reader what the report is about. A strong introduction begins with a general statement — for example: "Renewable energy is energy drawn from sources that are naturally replenished." It then provides brief background context. Introductions should be clear and direct — two to four sentences is sufficient. Do not include personal opinion; use formal, objective language. A well-written introduction makes the reader want to read on.', 'Identify the general statement in a model introduction provided by your teacher. What makes it effective?', 'Draft your introduction (3–4 sentences): general statement + background + topics to be covered.', '⭐ Challenge: Read a published information report and evaluate the strength of its introduction.']}], right:[{k:'steps', label:'Do this', rows:[{t:'Note-taking',d:'Identify the general statement in a model introduction provided by your teacher. What makes it effective?'}, {t:'Report Work — Draft Introduction',d:'Draft your introduction (3–4 sentences): general statement + background + topics to be covered.'}]}, {k:'html', html:`<div class="card dark"><span class="tag try">CHALLENGE</span><p style="margin-top:10px;color:var(--ink);font-size:15px;line-height:1.5">⭐ Challenge: Read a published information report and evaluate the strength of its introduction.</p></div>`}, {k:'exit', items:['follow report structure', 'draft or revise my report', 'use formal present-tense language']}], notes:`<p>Week 7 · Lesson 20 · Apply — Week 7 Lesson 20 — Content</p>` });
SLIDES.push({ nav:'L21A — Writing Body Paragraphs', eyebrow:'Week 7 · Lesson 21 · Learn', eyebrowR:'Lesson 21 · Screen A', title:'Writing Body Paragraphs', screenlbl:'Student screen 1 of 2', wideLeft:true, left:[{k:'html', html:`<div class="card spell"><span class="tag read">SPELLING FOCUS — prefix: con-</span><p class="spell-words"><span>con·clu·sion</span><span>com·pare</span><span>con·trast</span></p><p class="spell-hint">con- means "together" or "with." How does this apply to each word?</p></div>`}, {k:'hook', q:'Why do we need body paragraphs in an information report? What makes a body paragraph "strong"?'}], right:[ {k:'win15', can:'write one body-paragraph topic sentence', prove:'Name the energy type or idea the paragraph will cover.'}, {k:'wp', list:[{t:'conclusion',d:'the closing section that summarises the key points of a report'}, {t:'summarise',d:'to give the main points of something briefly and clearly'}, {t:'evidence',d:'facts or information that support a claim or argument'}]},  {k:'img', hero:true, src:'topic-sentence-example.png', diagram:true, cap:'Writing Body Paragraphs'}], notes:`<p>Week 7 · Lesson 21 · Learn — Writing Body Paragraphs</p>` });
SLIDES.push({ nav:'L21B — Content', eyebrow:'Week 7 · Lesson 21 · Apply', eyebrowR:'Lesson 21 · Screen B', title:'Week 7 Lesson 21 — Content', screenlbl:'Student screen 2 of 2', wideLeft:true, left:[{k:'html', html:`<div class="card cream"><span class="tag do">SENTENCE WORK — </span><p style="margin-top:10px;font-size:14px;color:#4a5a54">Starters: "One type of renewable energy is… It works by…"  |  "A key advantage of [X] is…"</p></div>`}, {k:'read', heading:'Reading', body:['Body paragraphs form the main part of an information report. Each paragraph focuses on one subtopic and opens with a topic sentence — a sentence telling the reader what the paragraph is about. This is followed by elaboration: facts, explanations and examples. Technical vocabulary should be used accurately. Paragraphs end with a linking sentence. Think of each body paragraph as a mini-report with a clear beginning, middle and end.', 'Practise writing one body paragraph using the TEEL structure: Topic sentence → Evidence → Explanation → Link.', 'Draft your solar energy body paragraph in full. Share with your teacher for feedback before Week 8.', '⭐ Challenge: Write a second body paragraph about another energy type of your choice.']}], right:[{k:'steps', label:'Do this', rows:[{t:'Note-taking',d:'Practise writing one body paragraph using the TEEL structure: Topic sentence → Evidence → Explanation → Link.'}, {t:'Report Work — Draft Paragraph',d:'Draft your solar energy body paragraph in full. Share with your teacher for feedback before Week 8.'}]}, {k:'html', html:`<div class="card dark"><span class="tag try">CHALLENGE</span><p style="margin-top:10px;color:var(--ink);font-size:15px;line-height:1.5">⭐ Challenge: Write a second body paragraph about another energy type of your choice.</p></div>`}, {k:'exit', items:['follow report structure', 'draft or revise my report', 'use formal present-tense language']}], notes:`<p>Week 7 · Lesson 21 · Apply — Week 7 Lesson 21 — Content</p>` });

SLIDES.push({ nav:'L22A — Using the InfoReport Tool', eyebrow:'Week 8 · Lesson 22 · Learn', eyebrowR:'Lesson 22 · Screen A', title:'Using the InfoReport Tool', screenlbl:'Student screen 1 of 2', wideLeft:true, left:[{k:'html', html:`<div class="card spell"><span class="tag read">SPELLING FOCUS — suffix: -ing</span><p class="spell-words"><span>head·ing</span><span>writ·ing</span><span>or·gan·is·ing</span></p><p class="spell-hint">Does the root word change when you add -ing? Find the rule for each.</p></div>`}, {k:'hook', q:'What would you want a reader to know about renewable energy after reading your report? What is the most important message?'}], right:[ {k:'win15', can:'open the InfoReport tool and start a section', prove:'Show the section heading on screen.'}, {k:'wp', list:[{t:'structure',d:'the way a piece of writing is organised into sections'}, {t:'heading',d:'a title that introduces a section of writing'}, {t:'subheading',d:'a smaller title that introduces a subsection within a section'}]},  {k:'img', hero:true, src:'inforeport-tool-screenshot.png', diagram:true, cap:'Using the InfoReport Tool'}], notes:`<p>Week 8 · Lesson 22 · Learn — Using the InfoReport Tool</p>` });
SLIDES.push({ nav:'L22B — Content', eyebrow:'Week 8 · Lesson 22 · Apply', eyebrowR:'Lesson 22 · Screen B', title:'Week 8 Lesson 22 — Content', screenlbl:'Student screen 2 of 2', wideLeft:true, left:[{k:'html', html:`<div class="card cream"><span class="tag do">SENTENCE WORK — Analyse</span><p style="margin-top:10px;font-size:16px;line-height:1.5">"An information report begins with a general statement that defines or classifies the topic for the reader."</p><p style="margin-top:10px;font-size:16px;line-height:1.5">Your turn: What is the purpose of this sentence? Identify the defining relative clause.</p><p style="margin-top:10px;font-size:14px;color:#4a5a54">Starters: "Renewable energy is energy that…"  |  "This report will discuss…"</p></div>`}, {k:'read', heading:'Reading', body:['Today you begin using the InfoReport tool to write your report on renewable energy. Read each prompt carefully and use your notes from your workbook. You have studied solar, wind, hydro, geothermal and tidal energy over seven weeks. Write in the present tense, use formal language and include technical vocabulary from your glossary. Take care with your introduction — it sets the tone for your whole report.', 'Open in your browser: planomy.github.io/inforeport', 'Type your introduction into the InfoReport tool. Use your draft from Lesson 20.', '⭐ Challenge: Add an extra section about the future of renewable energy.']}], right:[{k:'steps', label:'Do this', rows:[{t:'Note-taking',d:'Open in your browser: planomy.github.io/inforeport'}, {t:'Report Work — Introduction',d:'Type your introduction into the InfoReport tool. Use your draft from Lesson 20.'}, {t:'Open InfoReport',d:'planomy.github.io/inforeport'}]}, {k:'html', html:`<div class="card dark"><span class="tag try">CHALLENGE</span><p style="margin-top:10px;color:var(--ink);font-size:15px;line-height:1.5">⭐ Challenge: Add an extra section about the future of renewable energy.</p></div>`}, {k:'exit', items:['follow report structure', 'draft or revise my report', 'use formal present-tense language']}], assessTab:'task', notes:`<p>Week 8 · Lesson 22 · Apply — Week 8 Lesson 22 — Content</p><h4>InfoReport</h4><p>Open <b>planomy.github.io/inforeport</b> in a new tab.</p>` });
SLIDES.push({ nav:'L23A — Drafting Body Sections', eyebrow:'Week 8 · Lesson 23 · Learn', eyebrowR:'Lesson 23 · Screen A', title:'Drafting Body Sections', screenlbl:'Student screen 1 of 2', wideLeft:true, left:[{k:'html', html:`<div class="card spell"><span class="tag read">SPELLING FOCUS — prefix: re-</span><p class="spell-words"><span>re·vise</span><span>re·write</span><span>re·view</span></p><p class="spell-hint">All use re- meaning "again." What is the action of each word?</p></div>`}, {k:'hook', q:'Think back over 7 weeks. What is the most interesting thing you discovered about renewable energy?'}], right:[ {k:'win15', can:'draft four sentences for one body section', prove:'Use at least two glossary words.'}, {k:'wp', list:[{t:'draft',d:'an early version of a piece of writing, not yet finished or polished'}, {t:'revise',d:'to read through and improve a piece of writing'}, {t:'proofread',d:'to check a piece of writing carefully for errors'}]},  {k:'img', hero:true, src:'renewable-energy-mix.png', cap:'Drafting Body Sections'}], notes:`<p>Week 8 · Lesson 23 · Learn — Drafting Body Sections</p>` });
SLIDES.push({ nav:'L23B — Content', eyebrow:'Week 8 · Lesson 23 · Apply', eyebrowR:'Lesson 23 · Screen B', title:'Week 8 Lesson 23 — Content', screenlbl:'Student screen 2 of 2', wideLeft:true, left:[{k:'html', html:`<div class="card cream"><span class="tag do">SENTENCE WORK — Combine</span><p style="margin-top:10px;font-size:16px;line-height:1.5">"Solar energy uses sunlight." "Wind energy uses moving air."</p><p style="margin-top:10px;font-size:16px;line-height:1.5">Your turn: Use a contrast connector — start with "While solar energy uses sunlight, …"</p><p style="margin-top:10px;font-size:14px;color:#4a5a54">Starters: "[Energy type] is a form of renewable energy that…"  |  "One advantage is… However, one disadvantage is…"</p></div>`}, {k:'read', heading:'Reading', body:['Your body sections are the heart of your report. Each section covers one energy type. Begin with a clear topic sentence, then elaborate — explain how it works, where it is used, and its advantages and disadvantages. Use evidence from your reading passages and technical vocabulary from your glossary. Each section should include: a topic sentence, at least two supporting details and a closing sentence.', 'Check each body section: topic sentence ✓&nbsp; 2 details ✓&nbsp; closing sentence ✓. Fix any missing parts.', 'Complete all five body sections in the InfoReport tool using your notes and paragraph drafts.', '⭐ Challenge: Include statistics and data in at least two of your body sections.']}], right:[{k:'steps', label:'Do this', rows:[{t:'Note-taking',d:'Check each body section: topic sentence ✓&nbsp; 2 details ✓&nbsp; closing sentence ✓. Fix any missing parts.'}, {t:'Report Work — Body Sections',d:'Complete all five body sections in the InfoReport tool using your notes and paragraph drafts.'}]}, {k:'html', html:`<div class="card dark"><span class="tag try">CHALLENGE</span><p style="margin-top:10px;color:var(--ink);font-size:15px;line-height:1.5">⭐ Challenge: Include statistics and data in at least t function clozeCard(c){
  const re = /\{\{([^}]+)\}\}/g;
  const answers = [];
  let m; const src = c.text||'';
  while((m = re.exec(src))) answers.push(m[1]);
  let i = 0;
  const passage = src.replace(re, ()=>{
    const ans = answers[i];
    const n = i+1; i++;
    return `<span class="cloze-blank" data-ans="${ans.replace(/"/g,'&quot;')}" data-i="${n}" tabindex="0"><span class="slot-n">${n}</span><span class="slot-txt">&nbsp;</span></span>`;
  });
  // stable shuffle for word bank
  const bank = answers.map((w,idx)=>({w,idx}));
  let seed = 0; for(const ch of (c.heading||src)) seed = (seed*31 + ch.charCodeAt(0))|0;
  for(let a=bank.length-1;a>0;a--){ seed=(seed*1103515245+12345)&0x7fffffff; const b=seed%(a+1); [bank[a],bank[b]]=[bank[b],bank[a]]; }
  const chips = bank.map(o=>`<button type="button" class="chip" data-word="${o.w.replace(/"/g,'&quot;')}">${o.w}</button>`).join('');
  return `<div class="card cream cloze-card" data-cloze="1">
    <span class="tag read">${c.label||'KNOWLEDGE — CLOZE'}</span>
    ${c.heading?`<h3>${c.heading}</h3>`:''}
    <div class="cloze-passage">${passage}</div>
    <div class="cloze-bank-lbl">Word bank — jumbled · tap a word, then a blank</div>
    <div class="cloze-bank">${chips}</div>
    <div class="cloze-actions">
      <button type="button" class="primary" data-cloze-check>Check</button>
      <button type="button" data-cloze-reset>Reset</button>
      <button type="button" data-cloze-reveal>Reveal</button>
    </div>
    <p class="cloze-hint">${c.hint||'Use each word once. Read the whole sentence before you choose.'}</p>
  </div>`;
}
function wireCloze(){
  const root = document.querySelector('[data-cloze="1"]');
  if(!root) return;
  let selected = null;
  const bank = root.querySelector('.cloze-bank');
  const blanks = [...root.querySelectorAll('.cloze-blank')];
  function clearMarks(){ blanks.forEach(b=>b.classList.remove('correct','wrong')); }
  function selectChip(chip){
    bank.querySelectorAll('.chip').forEach(c=>c.classList.remove('picked'));
    if(!chip || chip.classList.contains('used')){ selected=null; return; }
    selected = chip; chip.classList.add('picked');
  }
  bank.addEventListener('click', e=>{
    const chip = e.target.closest('.chip');
    if(!chip) return;
    selectChip(chip);
  });
  blanks.forEach(blank=>{
    blank.addEventListener('click', ()=>{
      clearMarks();
      // return current word to bank
      const cur = blank.dataset.filled;
      if(cur){
        const chip = [...bank.querySelectorAll('.chip')].find(c=>c.dataset.word===cur && c.classList.contains('used'));
        if(chip) chip.classList.remove('used');
        blank.dataset.filled = '';
        blank.classList.remove('filled');
        blank.querySelector('.slot-txt').innerHTML = '&nbsp;';
      }
      if(!selected) return;
      const word = selected.dataset.word;
      blank.dataset.filled = word;
      blank.classList.add('filled');
      blank.querySelector('.slot-txt').textContent = word;
      selected.classList.add('used');
      selected.classList.remove('picked');
      selected = null;
    });
  });
  root.querySelector('[data-cloze-reset]').addEventListener('click', ()=>{
    selected=null; clearMarks();
    bank.querySelectorAll('.chip').forEach(c=>c.classList.remove('used','picked'));
    blanks.forEach(b=>{ b.dataset.filled=''; b.classList.remove('filled'); b.querySelector('.slot-txt').innerHTML='&nbsp;'; });
  });
  root.querySelector('[data-cloze-reveal]').addEventListener('click', ()=>{
    selected=null; clearMarks();
    bank.querySelectorAll('.chip').forEach(c=>{ c.classList.add('used'); c.classList.remove('picked'); });
    blanks.forEach(b=>{
      const ans=b.dataset.ans;
      b.dataset.filled=ans; b.classList.add('filled','correct');
      b.querySelector('.slot-txt').textContent=ans;
    });
  });
  root.querySelector('[data-cloze-check]').addEventListener('click', ()=>{
    blanks.forEach(b=>{
      b.classList.remove('correct','wrong');
      if(!b.dataset.filled){ b.classList.add('wrong'); return; }
      b.classList.add(b.dataset.filled===b.dataset.ans ? 'correct' : 'wrong');
    });
  });
}

    const isScreenC = !isReadA && !isDrill && (s.eyebrowR||'').includes('Screen C');
    const colClass = isDrill ? 'cols drill-cols' : isReadA ? 'cols read-a' : isScreenA ? 'cols screen-a wide-left' : isScreenC ? 'cols screen-c wide-left' : `cols ${s.wideLeft?'wide-left':''}`;
    const leftCls = isDrill ? 'col drill-side' : isReadA ? 'col left-read' : isScreenA ? 'col left-a' : isScreenC ? 'col left-c' : 'col';
    const rightCls = isDrill ? 'col drill-side' : isReadA ? 'col right-read' : isScreenA ? 'col right-a' : isScreenC ? 'col right-c' : 'col';
    const left = (s.left||[]).map(renderBlock).join('');
    const right = (s.right||[]).map(renderBlock).join('');
    html += `<div class="${colClass}"><div class="${leftCls}">${left}</div><div class="${rightCls}">${right}</div></div>`;
  }
  if(s.screenlbl) html+=`<div class="screenlbl">${s.screenlbl}</div>`;
  html += `<div class="corner"><kbd>T</kbd> notes · <kbd>D</kbd> detach · <kbd>A</kbd> assessment · <kbd>I</kbd> InfoReport</div>`;
  el.innerHTML = html;
  wireCloze();
}
let idx = 0;
function syncInfoReportBtn(){}
function show(i){
  idx = Math.max(0, Math.min(SLIDES.length-1, i));
  renderSlide(SLIDES[idx]);
  document.getElementById('counter').textContent = `${idx+1} / ${SLIDES.length}`;
  document.getElementById('jump').value = idx;
  if(document.getElementById('tnotes').classList.contains('open')) fillNotes();
  syncInfoReportBtn();
  updatePresentScale();
}
function buildJump(){
  const sel=document.getElementById('jump'); sel.innerHTML='';
  SLIDES.forEach((s,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=`${i+1}. ${s.nav||s.title||('Slide '+(i+1))}`; sel.appendChild(o); });
}
function fillNotes(){
  const s=SLIDES[idx];
  document.getElementById('tnotesTitle').textContent=s.nav||s.title||`Slide ${idx+1}`;
  document.getElementById('tnotesBody').innerHTML=(typeof TEACHER_NOTES!=='undefined'&&TEACHER_NOTES[s.nav])||s.notes||'<p>No notes for this screen.</p>';
}
function openNotes(){ document.getElementById('tnotes').classList.add('open'); document.getElementById('notesBtn').classList.add('notes-open'); fillNotes(); }
function closeNotes(){ document.getElementById('tnotes').classList.remove('open'); document.getElementById('notesBtn').classList.remove('notes-open'); }
function detachNotes(){
  const s=SLIDES[idx];
  const w=window.open('','tnotes','width=460,height=760');
  w.document.write(`<title>Teacher Notes — ${s.nav||s.title}</title><style>body{font-family:system-ui;background:#0f1c24;color:#b4c2c6;line-height:1.6;padding:22px;}h2{color:#ffe082}h4{color:#7ec4b4;margin:14px 0 4px}ul{margin-left:18px}li{margin:4px 0}</style><h2>${s.nav||s.title}</h2>${(typeof TEACHER_NOTES!=='undefined'&&TEACHER_NOTES[s.nav])||s.notes||'<p>No notes.</p>'}`);
  w.document.close();
}
let savedIdxForOverlay=null;
function switchAssessTab(pane){
  document.querySelectorAll('#overlay .tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('#overlay .panelpane').forEach(x=>x.classList.remove('active'));
  document.querySelector(`#overlay .tab[data-pane="${pane}"]`)?.classList.add('active');
  document.getElementById('pane-'+pane)?.classList.add('active');
}
function openOverlay(forcedPane){
  savedIdxForOverlay=idx;
  const slide = SLIDES[idx];
  const pane = (typeof forcedPane === 'string' && forcedPane) || slide?.assessTab || ASSESS_TAB_BY_NAV[slide?.nav] || 'task';
  switchAssessTab(pane);
  document.getElementById('overlay').classList.add('open');
}
function closeOverlay(){ document.getElementById('overlay').classList.remove('open'); if(savedIdxForOverlay!=null) show(savedIdxForOverlay); }
function openInfoReport(){ window.open(INFOREPORT_URL, '_blank', 'noopener'); }
document.getElementById('prev').onclick=()=>show(idx-1);
document.getElementById('next').onclick=()=>show(idx+1);
document.getElementById('jump').onchange=e=>show(+e.target.value);
document.getElementById('notesBtn').onclick=openNotes;
document.getElementById('notesClose').onclick=closeNotes;
document.getElementById('detachBtn').onclick=detachNotes;
document.getElementById('assessBtn').onclick=()=>openOverlay();
document.getElementById('inforeportBtn').onclick=openInfoReport;
document.getElementById('backBtn').onclick=closeOverlay;
function isPresenting(){
  return document.documentElement.classList.contains('presenting')
    || document.fullscreenElement || document.webkitFullscreenElement;
}
function setPresenting(on){ document.documentElement.classList.toggle('presenting', on); syncPresentBtn(); updatePresentScale(); }
function updatePresentScale(){
  const slide=document.getElementById('slide');
  if(!isPresenting()){ slide.style.transform=''; return; }
  const wrap=document.getElementById('stageWrap');
  const scale=Math.min(wrap.clientWidth/1180, wrap.clientHeight/738);
  slide.style.transform=`scale(${scale})`;
}
function togglePresent(){
  if(isPresenting()){
    setPresenting(false);
    if(document.fullscreenElement||document.webkitFullscreenElement)
      (document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen)?.call(document);
  } else {
    setPresenting(true);
    const el=document.documentElement;
    const req=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
    if(req) req.call(el).catch(()=>{});
  }
}
function syncPresentBtn(){
  document.getElementById('presentBtn').textContent = isPresenting() ? '⤢ Exit' : '⛶ Present';
}
function onFullscreenChange(){
  if(!document.fullscreenElement&&!document.webkitFullscreenElement)
    document.documentElement.classList.remove('presenting');
  syncPresentBtn();
  updatePresentScale();
}
document.getElementById('presentBtn').onclick=togglePresent;
document.addEventListener('fullscreenchange',onFullscreenChange);
document.addEventListener('webkitfullscreenchange',onFullscreenChange);
window.addEventListener('resize',updatePresentScale);
document.querySelectorAll('#overlay .tab').forEach(t=>t.onclick=()=>switchAssessTab(t.dataset.pane));
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT') return;
  if(e.key==='ArrowRight') show(idx+1);
  else if(e.key==='ArrowLeft') show(idx-1);
  else if(e.key.toLowerCase()==='t'){ document.getElementById('tnotes').classList.contains('open')?closeNotes():openNotes(); }
  else if(e.key.toLowerCase()==='d') detachNotes();
  else if(e.key.toLowerCase()==='a'){ document.getElementById('overlay').classList.contains('open')?closeOverlay():openOverlay(); }
  else if(e.key.toLowerCase()==='i') openInfoReport();
  else if(e.key.toLowerCase()==='f') togglePresent();
  else if(e.key==='Escape'){
    if(document.getElementById('tnotes').classList.contains('open')){ closeNotes(); return; }
    if(isPresenting()){ togglePresent(); return; }
    closeOverlay();
  }
});
document.getElementById('pane-task').innerHTML = ASSESS_TASK;
document.getElementById('pane-reading').innerHTML = ASSESS_READING;
document.getElementById('pane-guide').innerHTML = ASSESS_GUIDE;
buildJump(); show(0);
</script>
</body>
