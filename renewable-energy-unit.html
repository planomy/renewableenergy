<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Year 5 English · Renewable Energy</title>
<style>
  :root{
    --bg0:#0a1419; --bg1:#0f1c24; --bg2:#15242c;
    --ink:#f4f7f6; --ink-dim:#b4c2c6; --ink-faint:#7a9098;
    --panel:#1e2c34; --panel2:#24353f; --line:#3d4f58;
    --chip-bg:#1a262e;
    --cream:#fef9e7; --cream-ink:#1e2a28;
    --amber:#f9d45d; --amber2:#ffe082;
    --accent:#4a9e8e; --accent2:#6bb8a8; --teal:#4a9e8e; --mint:#7ec4b4;
    --notice-bg:#e1f5e6; --notice-ink:#1a3d32; --notice-border:#6bb8a8;
    --p1:#ff5a6e; --p2:#7ec4b4; --p3:#5aa9ff; --p4:#b88bff; --p5:#ffb347;
    --radius:18px;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);color:var(--ink);background:var(--bg0);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #app{width:100vw;height:100vh;display:flex;flex-direction:column;}
  #stageWrap{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 18px 6px;min-height:0;}
  .slide{position:relative;width:min(1180px,100%);aspect-ratio:16/10;max-height:100%;
    background:radial-gradient(1200px 500px at 80% -10%, rgba(126,196,180,.06), transparent 60%), linear-gradient(160deg,var(--bg1),var(--bg2) 60%, #101c22);
    border:1px solid var(--line);border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
    padding:26px 38px 48px;overflow:hidden;display:flex;flex-direction:column;}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:rgba(107,184,168,.10);color:var(--accent2);border:1px solid rgba(107,184,168,.28);
    font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;padding:7px 14px;border-radius:999px;}
  h1.title{font-size:clamp(28px,3.6vw,46px);line-height:1.02;margin:10px 0 12px;letter-spacing:-.01em;}
  .slide.cover h1.title{font-size:clamp(40px,6vw,76px);}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0;}
  .cols.wide-left{grid-template-columns:1.25fr .9fr;}
  .cols.screen-a{grid-template-columns:1.15fr .92fr;align-items:stretch;}
  .cols.read-a{grid-template-columns:1.35fr .85fr;align-items:stretch;gap:12px;}
  .col.left-read{min-height:0;overflow:hidden;}
  .col.left-read > .card.cream.long-read{
    flex:1 1 auto;min-height:0;max-height:none;overflow:auto;padding:16px 18px;
  }
  .col.left-read > .card.cream.long-read h3{font-size:clamp(17px,1.8vw,22px);margin-bottom:10px;}
  .col.left-read > .card.cream.long-read p{font-size:clamp(14px,1.35vw,17px);line-height:1.5;margin-bottom:10px;}
  .col.right-read{min-height:0;overflow:hidden;gap:8px;}
  .col.right-read .wp{flex:0 0 auto;}
  .col.right-read .brain.checkin{flex:1 1 auto;min-height:0;overflow:auto;}
  .brain.checkin .qtype{color:var(--mint);font-weight:800;margin-right:4px;}
  .brain.checkin li{font-size:clamp(12.5px,1.25vw,15.5px);line-height:1.35;}
  .col{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden;}
  /* Screen A: READ grows; spelling sits mid-left; hero image fills bottom-right */
  .col.left-a > .card.cream{flex:1 1 auto;min-height:0;max-height:none;overflow:auto;}
  .col.left-a > .card.spell{flex:0 0 auto;}
  .col.left-a .hook{flex:0 0 auto;margin-top:auto;}
  .col.right-a .wp{flex:0 0 auto;}
  .col.right-a .brain{flex:0 0 auto;}
  .col.right-a .win15{flex:0 0 auto;}
  .col.right-a .imgframe.hero{flex:1 1 auto;min-height:min(26vh,220px);max-height:min(46vh,420px);margin-top:auto;}
  .col::-webkit-scrollbar{width:6px;} .col::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
  .col > .card.cream,
  .col > .steps{flex:0 1 auto;min-height:0;max-height:62%;overflow:auto;}
  .col > .card.cream.eng-pack{flex:1 1 0;max-height:none;min-height:0;overflow:auto;}
  .col > .imgframe, .col > .imgrow{flex:1 1 0;min-height:100px;min-width:0;width:100%;}
  .card{border-radius:var(--radius);padding:20px 22px;}
  .card.cream{background:var(--cream);color:var(--cream-ink);box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:auto;}
  .card.dark{background:var(--panel);border:1px solid var(--line);}
  .tag{display:inline-block;font-weight:900;font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--amber);color:#3a2c00;padding:5px 12px;border-radius:999px;margin-bottom:12px;}
  .tag.read{background:var(--amber)} .tag.wow{background:#ff6b8a;color:#3a0010}
  .tag.do{background:var(--mint);color:#063a2c} .tag.try{background:#ffd766;color:#3a2c00}
  .card h3{font-size:clamp(18px,2vw,24px);margin-bottom:8px;}
  .card.cream p,.card.cream li{font-size:clamp(15px,1.45vw,19px);line-height:1.45;}
  .spell-words{display:flex;flex-wrap:wrap;gap:0 1.75em;margin-top:10px;font-size:17px;line-height:1.45;font-weight:700;color:var(--ink);}
  .card.spell{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid rgba(107,184,168,.35);}
  .card.spell .spell-hint{margin-top:8px;color:var(--ink-dim);font-size:15px;}
  .spell-words span{white-space:nowrap;}
  .notice{margin-top:12px;background:var(--notice-bg);border-left:5px solid var(--notice-border);color:var(--notice-ink);padding:10px 13px;border-radius:10px;font-size:14.5px;}
  .notice b{color:#2d6b58}
  .hook{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 15px;}
  .hook .lbl{color:var(--amber2);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;}
  .hook p{font-size:clamp(15px,1.5vw,20px);margin-top:5px;line-height:1.3;}
  .card.dark.wp{padding:14px 16px;}
  .wp h4{color:var(--ink);font-size:16px;margin-bottom:8px;}
  .wp-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
  .chip{background:var(--chip-bg);border:1px solid var(--line);border-radius:11px;padding:7px 10px;}
  .chip b{display:block;font-size:14.5px;color:var(--mint);}
  .chip span{font-size:12px;color:var(--ink-dim);line-height:1.25;}
  .brain{background:linear-gradient(150deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;}
  .brain .lbl{display:flex;align-items:center;gap:9px;color:var(--amber2);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:12px;margin-bottom:8px;}
  .brain ol{list-style:none;display:flex;flex-direction:column;gap:7px;}
  .brain li{display:flex;gap:10px;font-size:clamp(13.5px,1.35vw,17px);line-height:1.28;}
  .brain .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;color:#1a3d32;background:linear-gradient(135deg,var(--mint),var(--accent));}


  /* Cloze knowledge (Screen C left) */
  .col > .card.cloze-card{
    flex:1 1 0;min-height:0;max-height:none !important;overflow:auto;
    display:flex;flex-direction:column;
  }
  .cloze-card h3{font-size:clamp(17px,1.8vw,22px);margin:4px 0 10px;}
  .cloze-passage{font-size:clamp(15px,1.45vw,19px);line-height:1.65;color:var(--cream-ink);flex:0 0 auto;}
  .cloze-blank{display:inline-flex;align-items:center;justify-content:center;min-width:4.5em;min-height:1.35em;margin:0 2px;padding:1px 8px;
    border-bottom:2.5px solid #c4b88a;border-radius:6px 6px 0 0;background:rgba(255,255,255,.55);cursor:pointer;
    font-weight:800;color:var(--notice-ink);vertical-align:baseline;transition:background .15s,border-color .15s;}
  .cloze-blank:hover{background:#fff;}
  .cloze-blank.filled{border-bottom-color:var(--accent);background:#e8f6f1;}
  .cloze-blank.correct{border-bottom-color:#2d6b58;background:var(--notice-bg);}
  .cloze-blank.wrong{border-bottom-color:#c45a5a;background:#fde8e8;}
  .cloze-blank .slot-n{font-size:10px;font-weight:800;color:#8a7a4a;margin-right:4px;}
  .cloze-bank-lbl{margin-top:auto;padding-top:14px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#6a5a30;}
  .cloze-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .cloze-bank .chip{cursor:pointer;user-select:none;background:#fff;border:1px solid #d8cda6;border-radius:999px;padding:7px 12px;
    font-size:14px;font-weight:700;color:var(--cream-ink);transition:transform .12s,opacity .12s,border-color .12s;}
  .cloze-bank .chip:hover{border-color:var(--accent);transform:translateY(-1px);}
  .cloze-bank .chip.picked{border-color:var(--accent);box-shadow:0 0 0 2px rgba(74,158,142,.35);background:#e8f6f1;}
  .cloze-bank .chip.used{opacity:.35;pointer-events:none;text-decoration:line-through;}
  .cloze-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .cloze-actions button{font:inherit;font-size:13px;font-weight:800;border-radius:999px;padding:7px 14px;cursor:pointer;
    border:1px solid #d8cda6;background:#fff;color:var(--cream-ink);}
  .cloze-actions button.primary{background:var(--mint);border-color:var(--mint);color:#063a2c;}
  .cloze-hint{margin-top:8px;font-size:13px;color:#4a5a54;font-style:italic;}

  /* English drill — 10+10 worksheet style */
  .cols.drill-cols{grid-template-columns:1fr 1fr;gap:12px;align-items:stretch;}
  .col.drill-side{min-height:0;overflow:hidden;}
  .col.drill-side > .drill-panel{
    flex:1 1 0;min-height:0;max-height:none;overflow:auto;
    background:var(--cream);color:var(--cream-ink);border-radius:var(--radius);
    border:1.5px solid #c5d6a8;padding:0 0 10px;box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .drill-head{
    background:#b7d46a;color:#1a2a10;font-weight:900;font-size:clamp(14px,1.4vw,17px);
    letter-spacing:.02em;text-align:center;padding:9px 12px;border-radius:var(--radius) var(--radius) 0 0;
    border-bottom:1px solid #9bbb4e;
  }
  .drill-qs{list-style:none;padding:6px 11px 2px;margin:0;display:flex;flex-direction:column;gap:5px;}
  .drill-qs li{display:grid;grid-template-columns:20px 1fr;gap:5px;align-items:start;
    font-size:clamp(11px,1.1vw,13px);line-height:1.22;}
  .drill-qs .dn{font-weight:900;color:#d62828;padding-top:1px;}
  .drill-qs .ask{color:var(--cream-ink);font-weight:650;}
  .drill-qs .samp{display:block;margin-top:1px;font-style:italic;color:#2f6f62;font-weight:600;}
  .drill-qs .line{display:none;}
  .drill-qs .choices{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:2px;font-weight:700;color:#2f6f62;}
  .drill-qs .yn{display:none;}
  .drill-qs .yn span{display:none;}
  .drill-qs .yn i{display:none;}
  .slide.lesson .title.drill-title{font-size:clamp(20px,2.5vw,30px);margin:4px 0 6px;}
  .col > .card.cream.stem-card{flex:1 1 0;max-height:none;min-height:0;overflow:auto;}
  .stem-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stem-grid span{
    background:#fff;border:1px solid #d8cda6;border-radius:12px;padding:12px 14px;
    font-weight:800;font-size:clamp(14px,1.35vw,17px);color:var(--cream-ink);line-height:1.25;
  }

  .cols.screen-c{grid-template-columns:1.2fr .95fr;}
  .col.right-c > .discuss-card{flex:1 1 auto;min-height:0;overflow:auto;}
  .col.right-c > .steps{flex:0 1 auto;max-height:48%;}

  .know-card h3{font-size:17px;margin:8px 0 6px}
  .know-list{margin:8px 0 0;padding-left:18px;font-size:14px;line-height:1.45;color:var(--cream-ink)}
  .know-list li{margin-bottom:6px}
  .discuss-card h3{font-size:17px}
  .discuss-list{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:0;margin-left:0}
  .discuss-list li{display:flex;gap:10px;font-size:14px;line-height:1.35}
  .discuss-list .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:11px;background:var(--chip-bg);border:1px solid var(--line)}
  .discuss-tip{margin-top:10px;font-size:13px;color:var(--ink-faint);font-style:italic}
  .sort-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .sort-col{background:var(--chip-bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}
  .sort-col b{display:block;margin-bottom:6px;color:var(--mint);font-size:12px;letter-spacing:.06em;text-transform:uppercase}

  .steps{background:var(--cream);color:var(--cream-ink);border-radius:var(--radius);padding:18px 20px;}
  .steps .tag{margin-bottom:14px}
  .steps .row{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed #d8cda6;}
  .steps .row:last-child{border-bottom:none}
  .steps .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--panel2);color:var(--mint);display:grid;place-items:center;font-weight:900;}
  .steps .row b{font-size:18px;display:block;} .steps .row span{font-size:15px;color:#4a5a54;}
  
  /* 15-minute demonstrable win */
  .win15{
    background:linear-gradient(135deg, color-mix(in srgb, var(--mint, #3d9b8f) 18%, transparent), var(--panel2, var(--panel)));
    border:1px solid color-mix(in srgb, var(--mint, #3d9b8f) 45%, var(--line));
    border-radius:var(--radius); padding:12px 14px; margin-bottom:2px;
  }
  .win15 .lbl{
    font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--mint, #2a9d8f); margin-bottom:6px;
  }
  .win15 .can{
    font-family:inherit; font-size:clamp(16px,1.9vmin,22px); font-weight:800;
    letter-spacing:-.02em; line-height:1.25; margin:0 0 8px;
  }
  .win15 .prove{
    font-size:13.5px; color:var(--ink-dim, #4a5a54); line-height:1.4; margin:0;
  }
  .win15 .prove b{ color:var(--ink); }

  .exit{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .exit h4{font-size:20px;margin-bottom:12px;}
  .exit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .echk{display:flex;gap:10px;align-items:center;background:var(--chip-bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;}
  .echk .bx{flex:none;width:24px;height:24px;border-radius:7px;background:var(--mint);color:#1a3d32;display:grid;place-items:center;font-weight:900;}
  .imgframe{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--chip-bg);min-height:100px;}
  .imgframe.hero{min-height:min(28vh,240px);display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0c1619,#152428);}
  .imgframe img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;}
  /* Hero photos: show the whole image (less cropping); letterbox on dark frame */
  .imgframe.hero img{width:100%;height:100%;max-height:100%;object-fit:contain;object-position:center;min-height:0;}
  .imgframe:not(.hero) img{position:absolute;inset:0;}
  .imgframe.diagram img{object-fit:contain;background:var(--bg0);}
  .imgframe.hero.diagram{background:var(--bg0);}
  .imgframe.hero.diagram img{object-fit:contain;min-height:0;}
  .imgframe.fit img{object-fit:contain;}
  .imgframe .cap{position:absolute;left:0;right:0;bottom:0;z-index:1;background:linear-gradient(transparent,rgba(10,20,25,.92));color:#e8f0ee;font-size:12.5px;padding:18px 12px 8px;font-weight:600;}
  .slide.cover{align-items:flex-start;justify-content:center;text-align:left;}
  .cover .sub{font-size:clamp(18px,2.2vw,26px);color:var(--ink-dim);max-width:760px;line-height:1.4;}
  .cover .meta{margin-top:auto;display:flex;gap:22px;flex-wrap:wrap;color:var(--ink-faint);font-weight:700;letter-spacing:.05em;}
  .cover .pill{background:rgba(107,184,168,.10);border:1px solid rgba(107,184,168,.25);color:var(--mint);padding:8px 16px;border-radius:999px;}
  .slide.divider{justify-content:center;}
  .divider .pkr{font-size:clamp(20px,3vw,30px);color:var(--ink-dim);font-weight:800;letter-spacing:.2em;text-transform:uppercase;}
  .divider h1{font-size:clamp(40px,6vw,72px);margin:10px 0 18px;}
  .divider .goals{display:flex;flex-direction:column;gap:12px;max-width:840px;}
  .divider .goal{display:flex;gap:14px;align-items:center;font-size:clamp(17px,1.9vw,22px);background:var(--panel);border:1px solid var(--line);padding:14px 18px;border-radius:14px;}
  .divider .goal i{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-weight:900;color:#06251c;}
  .slide.checkpoint{justify-content:center;text-align:center;align-items:center;}
  .checkpoint h1{font-size:clamp(34px,5vw,60px)} .checkpoint p{font-size:clamp(18px,2vw,24px);color:var(--ink-dim);max-width:780px;margin:14px auto 24px;}
  .corner{position:absolute;right:26px;bottom:18px;color:var(--ink-faint);font-size:12px;letter-spacing:.08em;}
  .corner kbd{background:var(--chip-bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11px;}
  .screenlbl{position:absolute;left:38px;bottom:18px;color:var(--ink-faint);font-size:12px;letter-spacing:.12em;text-transform:uppercase;}
  .eyebrow-r{position:absolute;right:38px;top:30px;color:var(--ink-faint);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;}
  /* Present mode — scale slide to fill viewport (Teams / laptop share) */
  html.presenting body,html:fullscreen body{align-items:stretch;justify-content:stretch;background:var(--bg1);}
  html.presenting #app,html:fullscreen #app{height:100dvh;}
  html.presenting #nav,html:fullscreen #nav{flex-shrink:0;padding:8px 10px;background:var(--bg0);border-top:1px solid var(--line);}
  html.presenting #stageWrap,html:fullscreen #stageWrap{
    padding:0;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:var(--bg1);
  }
  html.presenting .slide,html:fullscreen .slide{
    width:1180px;height:738px;max-width:none;max-height:none;aspect-ratio:auto;flex-shrink:0;
    border-radius:0;border:none;box-shadow:none;
    padding:26px 38px 48px;
    transform-origin:center center;
  }
  html.presenting .corner,html.presenting .screenlbl,html:fullscreen .corner,html:fullscreen .screenlbl{display:none;}
  html.presenting .cols,html:fullscreen .cols{flex:1;min-height:0;align-items:stretch;}
  html.presenting .col,html:fullscreen .col{height:100%;}
  html.presenting .col > .card.cream,html.presenting .col > .card.cloze-card,html.presenting .col > .steps,html.presenting .col > .brain,html.presenting .col > .hook,html.presenting .col > .imgframe,
  html:fullscreen .col > .card.cream,html:fullscreen .col > .card.cloze-card,html:fullscreen .col > .steps,html:fullscreen .col > .brain,html:fullscreen .col > .hook,html:fullscreen .col > .imgframe{
    flex:1 1 0;min-height:0;max-height:none;overflow:auto;
  }
  html.presenting .col > .exit,html:fullscreen .col > .exit{flex:0 0 auto;}
  html.presenting .col.left-a .hook,html:fullscreen .col.left-a .hook{margin-top:0;}
  html.presenting .col.right-a .imgframe.hero,html:fullscreen .col.right-a .imgframe.hero{margin-top:0;}
  #nav{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;flex-wrap:wrap;}
  .btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
  .btn:hover{border-color:var(--mint);color:#fff;}
  .btn.primary{background:var(--mint);color:#1a3d32;border-color:var(--mint);}
  .btn.assess{background:linear-gradient(135deg,var(--amber),#ff9d3c);color:#3a2400;border:none;font-weight:900;}
  .btn.inforeport{background:linear-gradient(135deg,#6a9fd4,#7ec4b4);color:#102028;border:none;font-weight:900;}
  .btn.inforeport.hidden{display:none;}
  .btn.notes-open{border-color:var(--mint);color:#fff;box-shadow:0 0 0 1px rgba(126,196,180,.35);}

  #overlay{position:fixed;inset:0;background:rgba(8,14,18,.84);backdrop-filter:blur(6px);z-index:60;display:none;align-items:center;justify-content:center;padding:24px;}

<body>

    <button class="btn" id="notesBtn">Teacher notes</button>
    <button class="btn" id="presentBtn" title="Maximise slide for screen share (F · Esc to exit)">⛶ Present</button>

  </header>
  <div class="body" id="tnotesBody"></div>
</aside>

    <header>
      <h2>📋 Assessment — Renewable Energy</h2>
      <div class="tabs">
        <button class="tab active" data-pane="task">Report task</button>
        <button class="tab" data-pane="reading">Reading</button>
        <button class="tab" data-pane="guide">Report guide</button>

    <div class="content">
      <div class="panelpane active" id="pane-task"></div>
      <div class="panelpane" id="pane-reading"></div>

    <footer>
      <span class="hint">Tip: press <b>A</b> to open/close · Back returns you to your slide</span>
      <button class="btn primary" id="backBtn">← Back to my slide</button>
    </footer>
